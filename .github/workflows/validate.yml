name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  actionlint:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 # v1.7.7

  # Syntax, source integrity, and metadata are checked on both platforms.
  # Main pushes run every section/scope in parallel below as the backstop for
  # change-scoped PR selection; the serial suite remains a manual release gate.
  posix:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 10
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Validate Bash and integrity
        shell: bash
        run: |
          set -eu
          bash -n plugins/roundhouse/scripts/roundhouse
          bash -n plugins/roundhouse/scripts/certify-ssh-node
          bash -n plugins/roundhouse/scripts/collect-posix
          bash -n plugins/roundhouse/scripts/enroll-privilege-posix
          bash -n plugins/roundhouse/scripts/enroll-ssh-posix
          bash -n plugins/roundhouse/scripts/launcher-install
          bash -n plugins/roundhouse/scripts/prepare-ssh-identity
          bash -n plugins/roundhouse/scripts/git-merge-plugin-version
          bash -n plugins/roundhouse/scripts/preflight
          bash -n plugins/roundhouse/scripts/privilege-broker-posix
          bash -n plugins/roundhouse/scripts/privilege-lane-posix
          bash -n plugins/roundhouse/scripts/test-roundhouse
          bash -n plugins/roundhouse/scripts/update-integrity
          for unit in plugins/roundhouse/scripts/lib/*.sh \
            plugins/roundhouse/scripts/tests/*.sh; do
            bash -n "$unit"
          done
          # Every section runs without registration, but shellcheck -x only
          # reaches the ones listed in the driver's lint anchor.
          unanchored=$(for f in plugins/roundhouse/scripts/tests/[0-9][0-9]-*.sh; do
            grep -qxF "  # shellcheck source=tests/${f##*/}" \
              plugins/roundhouse/scripts/test-roundhouse || printf '%s\n' "${f##*/}"
          done)
          if [ -n "$unanchored" ]; then
            printf 'sections missing from the test-roundhouse lint anchor:\n%s\n' "$unanchored" >&2
            exit 1
          fi
          if [[ "$RUNNER_OS" == Linux ]]; then
            # -x follows the `# shellcheck source=` directives in the CLI and in
            # the self-check driver, so the sourced units and sections are
            # analysed as the one program each becomes.
            shellcheck --severity=warning -x -P SCRIPTDIR \
              plugins/roundhouse/scripts/roundhouse \
              plugins/roundhouse/scripts/collect-posix \
              plugins/roundhouse/scripts/privilege-lane-posix \
              plugins/roundhouse/scripts/launcher-install \
              plugins/roundhouse/scripts/test-roundhouse \
              plugins/roundhouse/scripts/update-integrity
          fi
          plugins/roundhouse/scripts/update-integrity
          git diff --exit-code -- plugins/roundhouse/integrity.json
      - name: Validate fleet skill frontmatter
        shell: bash
        run: |
          set -eu
          python3 - plugins/roundhouse/skills/*/SKILL.md <<'PY'
          import pathlib
          import sys

          for argument in sys.argv[1:]:
              path = pathlib.Path(argument)
              lines = path.read_text(encoding="utf-8").splitlines()
              if not lines or lines[0] != "---" or "---" not in lines[1:]:
                  raise SystemExit(f"invalid frontmatter boundary: {path}")
              end = lines.index("---", 1)
              fields = {}
              for line in lines[1:end]:
                  if ": " not in line:
                      raise SystemExit(f"invalid frontmatter field: {path}: {line}")
                  key, value = line.split(": ", 1)
                  if key in fields or not value:
                      raise SystemExit(f"invalid frontmatter value: {path}: {key}")
                  fields[key] = value
              if set(fields) != {"name", "description"} or fields["name"] != path.parent.name:
                  raise SystemExit(f"invalid skill identity: {path}")
          PY
  # Independent helper self-tests run on both host OSes. Enrollment has two
  # complete fixture-platform lifecycles; give each its own job while retaining
  # both on Linux and macOS. Other helpers still get one job per host OS.
  helpers:
    name: helpers (${{ matrix.os }}, ${{ matrix.fixture.helper }}, ${{ matrix.fixture.platform || 'self-test' }})
    timeout-minutes: 10
    needs: select
    if: needs.select.outputs.helpers != '[]'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        fixture: ${{ fromJSON(needs.select.outputs.helpers) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install OpenSSH server for scope validation
        if: runner.os == 'Linux'
        # Bounded and skippable. apt-get here is an UNBOUNDED external
        # dependency sitting in the critical path of every Linux job: when a
        # mirror stalls it has held jobs past eight minutes doing nothing, which
        # no amount of test scoping can fix. The runner image usually ships
        # sshd already, so the common case now touches the network not at all.
        timeout-minutes: 4
        shell: bash
        run: |
          set -eu
          if command -v sshd >/dev/null 2>&1 || [ -x /usr/sbin/sshd ]; then
            printf 'sshd already present; skipping apt\n'
            exit 0
          fi
          for attempt in 1 2; do
            if sudo apt-get update && \
               sudo apt-get install -y --no-install-recommends openssh-server; then
              exit 0
            fi
            printf 'apt attempt %s failed; retrying\n' "$attempt" >&2
            sleep 5
          done
          printf 'could not install openssh-server\n' >&2
          exit 1
      - name: Validate ${{ matrix.fixture.helper }}
        shell: bash
        env:
          ROUNDHOUSE_SSH_SELFTEST_PLATFORM: ${{ matrix.fixture.platform }}
        run: |
          set -eu
          plugins/roundhouse/scripts/${{ matrix.fixture.helper }} self-test

  # Which test sections does THIS change actually require? select-sections is
  # fail-safe: an unmapped path, or no input at all, selects everything. Adding
  # a rule makes CI faster; forgetting one only makes it slower, never blinder.
  #
  # The selected sections and scopes are then split into weight-balanced
  # shards (tests/weights.tsv), each run by the parallel runner in one job.
  # One job per section and per scope used to mean ~60 macOS jobs per run, and
  # the account's macOS runner concurrency, not the tests, set the wall clock:
  # PR runs queued in waves for 13-16 minutes.
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      only: ${{ steps.pick.outputs.only }}
      scopes: ${{ steps.pick.outputs.scopes }}
      shards: ${{ steps.pick.outputs.shards }}
      helpers: ${{ steps.pick.outputs.helpers }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - id: pick
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ github.event_name }}' = pull_request ]; then
            base='${{ github.event.pull_request.base.sha }}'
            head='${{ github.event.pull_request.head.sha }}'
            changed=$(git diff --name-only "$base" "$head")
            printf 'changed paths:\n%s\n' "$changed"
            picked=$(printf '%s\n' "$changed" | plugins/roundhouse/scripts/select-sections)
            scopes=$(printf '%s\n' "$changed" | plugins/roundhouse/scripts/select-sections --scopes)
            helpers=$(printf '%s\n' "$changed" | plugins/roundhouse/scripts/select-sections --helpers)
          else
            picked=all
            scopes=all
            helpers=$(printf '%s\n' '' | plugins/roundhouse/scripts/select-sections --helpers)
          fi

          # ROUNDHOUSE_TEST_ONLY: empty runs every section. Section 68 carries
          # a partition marker, so the runner runs it as its five plan scopes,
          # and de-duplicates them against any plan scope selected below.
          if [ "$picked" = all ]; then only=''; else only=$(printf '%s' "$picked" | tr '\n' ' '); fi
          # ROUNDHOUSE_TEST_SCOPES: "all" is every scope from the source
          # guards except the manual u2-contracts composite, which only
          # repeats nine of them.
          scopes=$(printf '%s' "$scopes" | tr '\n' ' ')
          printf 'sections: %s\nscopes: %s\n' "${only:-all}" "${scopes:-none}"
          echo "only=$only" >> "$GITHUB_OUTPUT"
          echo "scopes=$scopes" >> "$GITHUB_OUTPUT"

          # Enough shards that each holds ~450 weighted seconds: with the
          # pool on the runner's cores that is ~3 minutes, plus setup.
          total=$(ROUNDHOUSE_TEST_ONLY="$only" ROUNDHOUSE_TEST_SCOPES="$scopes" \
            ROUNDHOUSE_TEST_LIST=true plugins/roundhouse/scripts/test-roundhouse |
            awk '{ s += $2 } END { print s + 0 }')
          units=$(ROUNDHOUSE_TEST_ONLY="$only" ROUNDHOUSE_TEST_SCOPES="$scopes" \
            ROUNDHOUSE_TEST_LIST=true plugins/roundhouse/scripts/test-roundhouse | grep -c .)
          count=$(( (total + 449) / 450 ))
          [ "$count" -ge 1 ] || count=1
          [ "$count" -le 8 ] || count=8
          # An empty shard fails, so never ask for more shards than units.
          [ "$count" -le "$units" ] || count=$units
          shards=$(seq 1 "$count" | jq -Rsc --arg k "$count" \
            'split("\n") | map(select(length > 0) | . + "/" + $k)')
          printf 'weight: %s -> shards: %s\n' "$total" "$shards"
          echo "shards=$shards" >> "$GITHUB_OUTPUT"

          # Only enrollment expands into two fixture-platform entries. Keep
          # the selector's helper names unchanged for local callers.
          printf 'helpers: %s\n' "$(printf '%s' "$helpers" | tr '\n' ' ')"
          hjson=$(printf '%s\n' "$helpers" | jq -Rsc '
            split("\n") | map(select(length > 0)) | unique |
            map(if . == "enroll-ssh-posix" then
              {helper:., platform:"linux"}, {helper:., platform:"macos"}
            else {helper:., platform:""} end)')
          echo "helpers=$hjson" >> "$GITHUB_OUTPUT"

  # One job per shard per OS, on every event. Each runs its shard's sections
  # and scopes through the parallel runner, which prints every unit's timing
  # and a failing unit's whole log, and kills a unit that hangs.
  sections:
    name: sections (${{ matrix.os }}, ${{ matrix.shard }})
    needs: select
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        shard: ${{ fromJSON(needs.select.outputs.shards) }}
    runs-on: ${{ matrix.os }}
    steps:
      # The suite deadline counts from the job's start, so a hung unit is
      # killed with its log a minute before the 10-minute job timeout,
      # however long the setup below takes.
      - name: Start the suite deadline
        run: echo "ROUNDHOUSE_TEST_DEADLINE=$(( $(date +%s) + 540 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install OpenSSH server for scope validation
        if: runner.os == 'Linux'
        # Bounded and skippable. apt-get here is an UNBOUNDED external
        # dependency sitting in the critical path of every Linux job: when a
        # mirror stalls it has held jobs past eight minutes doing nothing, which
        # no amount of test scoping can fix. The runner image usually ships
        # sshd already, so the common case now touches the network not at all.
        timeout-minutes: 4
        shell: bash
        run: |
          set -eu
          if command -v sshd >/dev/null 2>&1 || [ -x /usr/sbin/sshd ]; then
            printf 'sshd already present; skipping apt\n'
            exit 0
          fi
          for attempt in 1 2; do
            if sudo apt-get update && \
               sudo apt-get install -y --no-install-recommends openssh-server; then
              exit 0
            fi
            printf 'apt attempt %s failed; retrying\n' "$attempt" >&2
            sleep 5
          done
          printf 'could not install openssh-server\n' >&2
          exit 1
      - name: Install jj and yq for the real-jj sections
        timeout-minutes: 3
        shell: bash
        run: |
          set -eu
          jj_version=0.44.0
          yq_version=4.44.3
          case "$RUNNER_OS-$(uname -m)" in
            Linux-x86_64) jj_asset=x86_64-unknown-linux-musl; yq_asset=linux_amd64 ;;
            Linux-aarch64) jj_asset=aarch64-unknown-linux-musl; yq_asset=linux_arm64 ;;
            macOS-arm64) jj_asset=aarch64-apple-darwin; yq_asset=darwin_arm64 ;;
            macOS-x86_64) jj_asset=x86_64-apple-darwin; yq_asset=darwin_amd64 ;;
            *) echo "no pinned build for $RUNNER_OS-$(uname -m)" >&2; exit 1 ;;
          esac
          jj_tmp=$(mktemp -d)
          curl -fsSL --retry 3 \
            "https://github.com/jj-vcs/jj/releases/download/v$jj_version/jj-v$jj_version-$jj_asset.tar.gz" |
            tar -xz -C "$jj_tmp"
          sudo install -m 0755 "$jj_tmp/jj" /usr/local/bin/jj
          rm -rf "$jj_tmp"
          # Always install the pinned yq — never fall back to the runner's
          # pre-installed one. Number-form handling differs across yq versions
          # (some preserve 12.0, 4.44.3 normalizes it to 12), and the fold
          # digest's item identity depends on it, so the version must be pinned.
          curl -fsSL --retry 3 -o /tmp/yq \
            "https://github.com/mikefarah/yq/releases/download/v$yq_version/yq_$yq_asset"
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq
          jj --version
          yq --version
      - name: Shard ${{ matrix.shard }}
        shell: bash
        env:
          ROUNDHOUSE_TEST_ONLY: ${{ needs.select.outputs.only }}
          ROUNDHOUSE_TEST_SCOPES: ${{ needs.select.outputs.scopes }}
          ROUNDHOUSE_TEST_SHARD: ${{ matrix.shard }}
          # Fail a hung unit with its log inside the job timeout, rather
          # than losing every buffered log to a cancelled job; the deadline
          # set above bounds a unit that starts late.
          ROUNDHOUSE_TEST_UNIT_TIMEOUT: '480'
          # Travels with the suite. Without it a real-jj section prints a NOTICE
          # and PASSES, so moving the suite here without this flag would have
          # silently stopped verifying the store's repository half.
          ROUNDHOUSE_REQUIRE_REAL_JJ: 'true'
        run: |
          chmod -R go-w plugins/roundhouse
          plugins/roundhouse/scripts/test-roundhouse

  windows:
    timeout-minutes: 10
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Validate PowerShell native boundaries and release hashes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $scripts = @(
            "plugins/roundhouse/scripts/collect-windows.ps1",
            "plugins/roundhouse/scripts/apply-windows.ps1",
            "plugins/roundhouse/scripts/codex-plugin-hooks.ps1",
            "plugins/roundhouse/scripts/enroll-privilege-windows.ps1",
            "plugins/roundhouse/scripts/enroll-windows-sftp.ps1",
            "plugins/roundhouse/scripts/interop-windows.ps1",
            "plugins/roundhouse/scripts/mcp-siding-windows.ps1",
            "plugins/roundhouse/scripts/node-fnm-windows.ps1",
            "plugins/roundhouse/scripts/privilege-broker-windows.ps1",
            "plugins/roundhouse/scripts/profile-worker-windows.ps1",
            "plugins/roundhouse/scripts/register-profile-task-windows.ps1",
            "plugins/roundhouse/scripts/windows-native-canary-runner.ps1"
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script), [ref]$tokens, [ref]$errors
            )
            if ($errors.Count -gt 0) { throw ($errors -join "`n") }
          }
          & pwsh -NoLogo -NoProfile -NonInteractive -File `
            "plugins/roundhouse/scripts/apply-windows.ps1" -SelfTest
          if ($LASTEXITCODE -ne 0) { throw "Windows native boundary self-test failed" }
          foreach ($script in @($scripts | Where-Object { $_ -notlike "*apply-windows.ps1" })) {
            & pwsh -NoLogo -NoProfile -NonInteractive -File $script -SelfTest
            if ($LASTEXITCODE -ne 0) { throw "Windows self-test failed: $script" }
          }
          $root = Resolve-Path "plugins/roundhouse"
          $integrity = Get-Content "$root/integrity.json" -Raw | ConvertFrom-Json
          foreach ($file in @($integrity.files)) {
            $actual = (Get-FileHash (Join-Path $root $file.path) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $file.sha256) { throw "Integrity mismatch: $($file.path)" }
          }
          $requirementPath = Join-Path $env:RUNNER_TEMP "roundhouse-executor.json"
          try {
            [ordered]@{
              schema = "roundhouse.executor"
              schema_version = 1
              plugin = $integrity.plugin
              marketplace = $integrity.marketplace
              version = $integrity.version
              integrity_manifest_sha256 = (
                Get-FileHash (Join-Path $root "integrity.json") -Algorithm SHA256
              ).Hash.ToLowerInvariant()
              files = @($integrity.files)
            } | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath $requirementPath -Encoding utf8NoBOM
            $verified = & pwsh -NoLogo -NoProfile -NonInteractive -File `
              "plugins/roundhouse/scripts/apply-windows.ps1" `
              -VerifyExecutor -ExecutorRequirementPath $requirementPath |
              ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $verified.verified -ne $true) {
              throw "Native executor verification failed"
            }
          } finally {
            Remove-Item -LiteralPath $requirementPath -Force -ErrorAction SilentlyContinue
          }

  # Single stable required-status-check context for main's branch protection.
  # A matrix exposes one context per cell (`sections` fans out per shard), so
  # there is no fixed name to require; this gate collapses every job's result
  # into one context. Require `ci-ok` in protection instead of the volatile
  # per-cell contexts — adding or renaming a scope never desyncs the rule.
  ci-ok:
    needs: [actionlint, posix, helpers, select, sections, windows]
    if: always()
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs succeeded
        shell: bash
        env:
          # Named individually rather than join(needs.*.result): a positional
          # list cannot say WHICH job skipped, and "some job skipped" is not a
          # verdict. Only helpers may legitimately skip.
          ACTIONLINT: ${{ needs.actionlint.result }}
          POSIX: ${{ needs.posix.result }}
          SELECT: ${{ needs.select.result }}
          SECTIONS: ${{ needs.sections.result }}
          WINDOWS: ${{ needs.windows.result }}
          HELPERS: ${{ needs.helpers.result }}
        run: |
          set -euo pipefail
          printf 'actionlint=%s posix=%s select=%s sections=%s windows=%s helpers=%s\n' \
            "$ACTIONLINT" "$POSIX" "$SELECT" "$SECTIONS" "$WINDOWS" "$HELPERS"

          # These run on every event and must SUCCEED. A skip here means the
          # gate stopped gating, which is worse than a red build because it is
          # quiet - so a skip is a failure for them, not a pass.
          for pair in "actionlint:$ACTIONLINT" "posix:$POSIX" "select:$SELECT" \
                      "sections:$SECTIONS" "windows:$WINDOWS"; do
            case ${pair#*:} in
              success) ;;
              *) printf '%s must run and succeed (got %s)\n' "${pair%%:*}" "${pair#*:}" >&2; exit 1 ;;
            esac
          done

          # Helpers are change-scoped and skip when nothing implicates them.
          # Success or skipped only - never failure or cancellation.
          case $HELPERS in
            success|skipped) ;;
            *) printf 'helpers did not succeed (got %s)\n' "$HELPERS" >&2; exit 1 ;;
          esac
          printf 'all required jobs succeeded\n'
