name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 # v1.7.7

  # The full serial suite still runs — on pushes to main, as the backstop that
  # catches anything the change-scoped selection got wrong. PRs run the selected
  # sections in parallel instead (see `select` / `sections` below). Keeping this
  # on main means a mis-scoped rule costs one late red build rather than silent
  # loss of coverage.
  posix:
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install OpenSSH server for scope validation
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends openssh-server
      # The five real-jj sections (90-94) are the only place the store's
      # repository half is exercised at all; without jj they print a NOTICE and
      # the signature gate, the reconcile runbook, the resolution ladder and
      # rollback go UNVERIFIED on every run. BOTH tools go in: the gate is
      # `jj AND yq`, ubuntu-latest ships yq and macos-latest does not, so
      # installing only jj would leave macOS skipping exactly as before.
      #
      # From the upstream releases rather than a distro package — Ubuntu
      # carries no jj at all and brew on the Linux runner builds it — and
      # PINNED, so neither project's next release can silently change what CI
      # proved. `/usr/local/bin` is one of the paths the suite probes after it
      # sanitizes PATH. Adds seconds; the suite stays one job.
      - name: Install jj and yq for the real-jj sections
        shell: bash
        run: |
          set -eu
          jj_version=0.44.0
          yq_version=4.44.3
          case "$RUNNER_OS-$(uname -m)" in
            Linux-x86_64) jj_asset=x86_64-unknown-linux-musl; yq_asset=linux_amd64 ;;
            Linux-aarch64) jj_asset=aarch64-unknown-linux-musl; yq_asset=linux_arm64 ;;
            macOS-arm64) jj_asset=aarch64-apple-darwin; yq_asset=darwin_arm64 ;;
            macOS-x86_64) jj_asset=x86_64-apple-darwin; yq_asset=darwin_amd64 ;;
            *) echo "no pinned build for $RUNNER_OS-$(uname -m)" >&2; exit 1 ;;
          esac
          jj_tmp=$(mktemp -d)
          curl -fsSL --retry 3 \
            "https://github.com/jj-vcs/jj/releases/download/v$jj_version/jj-v$jj_version-$jj_asset.tar.gz" |
            tar -xz -C "$jj_tmp"
          sudo install -m 0755 "$jj_tmp/jj" /usr/local/bin/jj
          rm -rf "$jj_tmp"
          # Always install the pinned yq — never fall back to the runner's
          # pre-installed one. Number-form handling differs across yq versions
          # (some preserve 12.0, 4.44.3 normalizes it to 12), and the fold
          # digest's item identity depends on it, so the version must be pinned.
          curl -fsSL --retry 3 -o /tmp/yq \
            "https://github.com/mikefarah/yq/releases/download/v$yq_version/yq_$yq_asset"
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq
          jj --version
          yq --version
      - name: Validate Bash and integrity
        shell: bash
        run: |
          set -eu
          bash -n plugins/roundhouse/scripts/roundhouse
          bash -n plugins/roundhouse/scripts/certify-ssh-node
          bash -n plugins/roundhouse/scripts/collect-posix
          bash -n plugins/roundhouse/scripts/enroll-privilege-posix
          bash -n plugins/roundhouse/scripts/enroll-ssh-posix
          bash -n plugins/roundhouse/scripts/launcher-install
          bash -n plugins/roundhouse/scripts/prepare-ssh-identity
          bash -n plugins/roundhouse/scripts/privilege-broker-posix
          bash -n plugins/roundhouse/scripts/test-roundhouse
          bash -n plugins/roundhouse/scripts/update-integrity
          for unit in plugins/roundhouse/scripts/lib/*.sh \
            plugins/roundhouse/scripts/tests/*.sh; do
            bash -n "$unit"
          done
          if [[ "$RUNNER_OS" == Linux ]]; then
            # -x follows the `# shellcheck source=` directives in the CLI and in
            # the self-check driver, so the sourced units and sections are
            # analysed as the one program each becomes.
            shellcheck --severity=warning -x -P SCRIPTDIR \
              plugins/roundhouse/scripts/roundhouse \
              plugins/roundhouse/scripts/collect-posix \
              plugins/roundhouse/scripts/launcher-install \
              plugins/roundhouse/scripts/test-roundhouse \
              plugins/roundhouse/scripts/update-integrity
          fi
          plugins/roundhouse/scripts/update-integrity
          git diff --exit-code -- plugins/roundhouse/integrity.json
      - name: Validate fleet skill frontmatter
        shell: bash
        run: |
          set -eu
          python3 - plugins/roundhouse/skills/*/SKILL.md <<'PY'
          import pathlib
          import sys

          for argument in sys.argv[1:]:
              path = pathlib.Path(argument)
              lines = path.read_text(encoding="utf-8").splitlines()
              if not lines or lines[0] != "---" or "---" not in lines[1:]:
                  raise SystemExit(f"invalid frontmatter boundary: {path}")
              end = lines.index("---", 1)
              fields = {}
              for line in lines[1:end]:
                  if ": " not in line:
                      raise SystemExit(f"invalid frontmatter field: {path}: {line}")
                  key, value = line.split(": ", 1)
                  if key in fields or not value:
                      raise SystemExit(f"invalid frontmatter value: {path}: {key}")
                  fields[key] = value
              if set(fields) != {"name", "description"} or fields["name"] != path.parent.name:
                  raise SystemExit(f"invalid skill identity: {path}")
          PY
      - name: Run fixture suite
        shell: bash
        env:
          # jj is installed above, so a skipped real-jj block is a broken
          # install rather than an unequipped host: fail instead of noticing.
          ROUNDHOUSE_REQUIRE_REAL_JJ: 'true'
        run: |
          chmod -R go-w plugins/roundhouse
          plugins/roundhouse/scripts/test-roundhouse

  # The scoped suites are early-exit shortcuts *inside* the same self-check:
  # a default invocation defines their bodies and never calls them, so they
  # ran nowhere until a human typed the variable. The list is derived from
  # the sections themselves — adding a scope enrolls it in CI, and no list
  # here can silently rot behind the tree.
  # Split out of `posix`, where the three ran SEQUENTIALLY and cost 13.8 min of
  # a 30.8 min job on macOS. They are fork-bound shell fixtures (thousands of
  # small stat/tr/cut execs), so there is nothing to cache and nothing blocked
  # on I/O: running them concurrently is the whole optimization. One job per
  # helper also names which helper failed instead of one opaque step.
  helpers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        helper: [enroll-ssh-posix, prepare-ssh-identity, certify-ssh-node]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install OpenSSH server for scope validation
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends openssh-server
      - name: Validate ${{ matrix.helper }}
        shell: bash
        run: |
          set -eu
          plugins/roundhouse/scripts/${{ matrix.helper }} self-test

  # Which test sections does THIS change actually require? Measured motivation:
  # the preamble (00/05/07) is ~3s and most sections are single-digit seconds,
  # while the serial suite was 16.8 min on macOS — so the cost is a few heavy
  # sections that most changes do not touch.
  #
  # select-sections is fail-safe: an unmapped path, or no input at all, selects
  # everything. Adding a rule makes CI faster; forgetting one only makes it
  # slower, never blinder.
  select:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      sections: ${{ steps.pick.outputs.sections }}
      all: ${{ steps.pick.outputs.all }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - id: pick
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          changed=$(git diff --name-only "$base" "$head")
          printf 'changed paths:\n%s\n' "$changed"
          picked=$(printf '%s\n' "$changed" | plugins/roundhouse/scripts/select-sections)
          printf 'selected: %s\n' "$(printf '%s' "$picked" | tr '\n' ' ')"
          if [ "$picked" = all ]; then
            echo 'all=true' >> "$GITHUB_OUTPUT"
            echo 'sections=[]' >> "$GITHUB_OUTPUT"
          else
            echo 'all=false' >> "$GITHUB_OUTPUT"
            json=$(printf '%s\n' "$picked" | grep -v '^$' | sort -u |
              awk 'BEGIN{printf "["} {printf "%s\"%s\"", (NR>1?",":""), $0} END{printf "]"}')
            echo "sections=$json" >> "$GITHUB_OUTPUT"
          fi

  # One job per selected section. Wall time becomes the preamble plus the single
  # slowest SELECTED section, rather than the sum of everything.
  sections:
    needs: select
    if: github.event_name == 'pull_request' && needs.select.outputs.all == 'false'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        section: ${{ fromJSON(needs.select.outputs.sections) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install OpenSSH server for scope validation
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends openssh-server
      - name: Section ${{ matrix.section }}
        shell: bash
        env:
          ROUNDHOUSE_TEST_ONLY: ${{ matrix.section }}
        run: plugins/roundhouse/scripts/test-roundhouse

  # When selection says "everything", run the serial suite rather than a matrix
  # of every section: the sections are sourced cumulatively, so a full matrix
  # would repeat the shared preamble 30 times for no gain.
  sections-all:
    needs: select
    if: github.event_name == 'pull_request' && needs.select.outputs.all == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install OpenSSH server for scope validation
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends openssh-server
      - name: Run full fixture suite
        shell: bash
        run: plugins/roundhouse/scripts/test-roundhouse

  scope-matrix:
    runs-on: ubuntu-latest
    outputs:
      scopes: ${{ steps.derive.outputs.scopes }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - id: derive
        shell: bash
        run: |
          set -eu
          scopes=$(grep -ho 'ROUNDHOUSE_TEST_SCOPE:-}" != [a-z0-9-]*' \
            plugins/roundhouse/scripts/tests/*.sh |
            awk '{ print $NF }' | LC_ALL=C sort -u |
            jq -Rsc 'split("\n") | map(select(. != ""))')
          [ "$scopes" != '[]' ] || {
            printf 'no ROUNDHOUSE_TEST_SCOPE suites found\n' >&2
            exit 1
          }
          printf 'scopes=%s\n' "$scopes" >>"$GITHUB_OUTPUT"

  # One runner per scope per platform. Each scope re-runs the sections ahead
  # of it, so these are siblings of the `posix` fixture step rather than extra
  # work bolted onto it: wall time stays one suite, not the sum of eight.
  scoped:
    needs: scope-matrix
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        scope: ${{ fromJSON(needs.scope-matrix.outputs.scopes) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install OpenSSH server for scope validation
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends openssh-server
      - name: Run scoped fixture suite
        shell: bash
        env:
          ROUNDHOUSE_TEST_SCOPE: ${{ matrix.scope }}
        run: |
          chmod -R go-w plugins/roundhouse
          plugins/roundhouse/scripts/test-roundhouse

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Validate PowerShell native boundaries and release hashes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $scripts = @(
            "plugins/roundhouse/scripts/collect-windows.ps1",
            "plugins/roundhouse/scripts/apply-windows.ps1",
            "plugins/roundhouse/scripts/codex-plugin-hooks.ps1",
            "plugins/roundhouse/scripts/enroll-privilege-windows.ps1",
            "plugins/roundhouse/scripts/enroll-windows-sftp.ps1",
            "plugins/roundhouse/scripts/mcp-siding-windows.ps1",
            "plugins/roundhouse/scripts/privilege-broker-windows.ps1",
            "plugins/roundhouse/scripts/profile-worker-windows.ps1",
            "plugins/roundhouse/scripts/register-profile-task-windows.ps1",
            "plugins/roundhouse/scripts/windows-native-canary-runner.ps1"
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script), [ref]$tokens, [ref]$errors
            )
            if ($errors.Count -gt 0) { throw ($errors -join "`n") }
          }
          & pwsh -NoLogo -NoProfile -NonInteractive -File `
            "plugins/roundhouse/scripts/apply-windows.ps1" -SelfTest
          if ($LASTEXITCODE -ne 0) { throw "Windows native boundary self-test failed" }
          foreach ($script in @($scripts | Where-Object { $_ -notlike "*apply-windows.ps1" })) {
            & pwsh -NoLogo -NoProfile -NonInteractive -File $script -SelfTest
            if ($LASTEXITCODE -ne 0) { throw "Windows self-test failed: $script" }
          }
          $root = Resolve-Path "plugins/roundhouse"
          $integrity = Get-Content "$root/integrity.json" -Raw | ConvertFrom-Json
          foreach ($file in @($integrity.files)) {
            $actual = (Get-FileHash (Join-Path $root $file.path) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $file.sha256) { throw "Integrity mismatch: $($file.path)" }
          }
          $requirementPath = Join-Path $env:RUNNER_TEMP "roundhouse-executor.json"
          try {
            [ordered]@{
              schema = "roundhouse.executor"
              schema_version = 1
              plugin = $integrity.plugin
              marketplace = $integrity.marketplace
              version = $integrity.version
              integrity_manifest_sha256 = (
                Get-FileHash (Join-Path $root "integrity.json") -Algorithm SHA256
              ).Hash.ToLowerInvariant()
              files = @($integrity.files)
            } | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath $requirementPath -Encoding utf8NoBOM
            $verified = & pwsh -NoLogo -NoProfile -NonInteractive -File `
              "plugins/roundhouse/scripts/apply-windows.ps1" `
              -VerifyExecutor -ExecutorRequirementPath $requirementPath |
              ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $verified.verified -ne $true) {
              throw "Native executor verification failed"
            }
          } finally {
            Remove-Item -LiteralPath $requirementPath -Force -ErrorAction SilentlyContinue
          }

  # Single stable required-status-check context for main's branch protection.
  # A matrix exposes one context per cell (and `scoped` fans out per suite), so
  # there is no fixed name to require; this gate collapses every job's result
  # into one context. Require `ci-ok` in protection instead of the volatile
  # per-cell contexts — adding or renaming a scope never desyncs the rule.
  ci-ok:
    needs: [actionlint, posix, helpers, select, sections, sections-all, scope-matrix, scoped, windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs succeeded
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          ACTIONLINT: ${{ needs.actionlint.result }}
          POSIX: ${{ needs.posix.result }}
          HELPERS: ${{ needs.helpers.result }}
          SELECT: ${{ needs.select.result }}
          SECTIONS: ${{ needs.sections.result }}
          SECTIONS_ALL: ${{ needs.sections-all.result }}
          SCOPE_MATRIX: ${{ needs.scope-matrix.result }}
          SCOPED: ${{ needs.scoped.result }}
          WINDOWS: ${{ needs.windows.result }}
        run: |
          set -euo pipefail
          fail=0
          note() { printf '%s\n' "$*" >&2; }

          # Checked per job, not as one joined blob. Three jobs are now
          # deliberately conditional, and the old `case` treated ANY `skipped`
          # as failure — so loosening it wholesale would have let a pull request
          # pass with no fixture suite run at all. Each job states which
          # outcomes are legitimate for it, and anything else is a failure.
          must_succeed() {
            local name=$1 result=$2
            [ "$result" = success ] && return 0
            note "FAIL $name: $result"
            fail=1
          }
          must_succeed actionlint "$ACTIONLINT"
          must_succeed helpers "$HELPERS"
          must_succeed scope-matrix "$SCOPE_MATRIX"
          must_succeed scoped "$SCOPED"
          must_succeed windows "$WINDOWS"

          if [ "$EVENT" = pull_request ]; then
            # posix is the main-branch backstop and is expected to be skipped.
            [ "$POSIX" = skipped ] || must_succeed posix "$POSIX"
            must_succeed select "$SELECT"
            # EXACTLY ONE of the two fixture paths must have run and passed.
            # Both skipped means the suite silently did not run, which is the
            # failure this whole change could most plausibly introduce.
            case "$SECTIONS/$SECTIONS_ALL" in
              success/skipped|skipped/success) : ;;
              *)
                note "FAIL fixture suite: sections=$SECTIONS sections-all=$SECTIONS_ALL"
                note "     exactly one of them must run and succeed"
                fail=1 ;;
            esac
          else
            # On a push the serial suite is the gate; the PR-only jobs are
            # expected to be skipped.
            must_succeed posix "$POSIX"
            for pair in "select/$SELECT" "sections/$SECTIONS" "sections-all/$SECTIONS_ALL"; do
              name=${pair%%/*}; result=${pair#*/}
              [ "$result" = skipped ] || must_succeed "$name" "$result"
            done
          fi

          [ "$fail" -eq 0 ] || { note "a required job did not succeed"; exit 1; }
          printf 'all required jobs succeeded (%s)\n' "$EVENT"
